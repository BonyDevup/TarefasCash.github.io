<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste LocalStorage</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        button { padding: 10px; margin: 5px; }
        #output { background: #f0f0f0; padding: 10px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>🔍 Teste de Persistência LocalStorage</h1>
    
    <div>
        <input type="text" id="testInput" placeholder="Digite algo para testar">
        <button onclick="salvarTeste()">💾 Salvar</button>
        <button onclick="carregarTeste()">📥 Carregar</button>
        <button onclick="limparTeste()">🗑️ Limpar</button>
    </div>
    
    <div id="output">
        Resultado aparecerá aqui...
    </div>
    
    <div>
        <h3>📊 Status do LocalStorage TarefasCash:</h3>
        <button onclick="verificarDados()">🔍 Verificar Dados Salvos</button>
        <div id="dados"></div>
    </div>

    <script>
        function salvarTeste() {
            const valor = document.getElementById('testInput').value;
            localStorage.setItem('teste_persistencia', valor);
            document.getElementById('output').innerHTML = `✅ Salvo: "${valor}"`;
        }
        
        function carregarTeste() {
            const valor = localStorage.getItem('teste_persistencia');
            document.getElementById('output').innerHTML = valor ? 
                `📥 Carregado: "${valor}"` : 
                `❌ Nenhum dado encontrado`;
        }
        
        function limparTeste() {
            localStorage.removeItem('teste_persistencia');
            document.getElementById('output').innerHTML = `🗑️ Dados limpos`;
        }
        
        function verificarDados() {
            const tasks = localStorage.getItem('tarefasCash_tasks');
            const transactions = localStorage.getItem('tarefasCash_transactions');
            const goals = localStorage.getItem('tarefasCash_goals');
            const budgets = localStorage.getItem('tarefasCash_budgets');
            
            document.getElementById('dados').innerHTML = `
                <h4>Dados encontrados:</h4>
                <p><strong>Tarefas:</strong> ${tasks ? `✅ ${JSON.parse(tasks).length} items` : '❌ Vazio'}</p>
                <p><strong>Transações:</strong> ${transactions ? `✅ ${JSON.parse(transactions).length} items` : '❌ Vazio'}</p>
                <p><strong>Metas:</strong> ${goals ? `✅ ${JSON.parse(goals).length} items` : '❌ Vazio'}</p>
                <p><strong>Orçamentos:</strong> ${budgets ? `✅ ${JSON.parse(budgets).length} items` : '❌ Vazio'}</p>
            `;
        }
        
        // Verificar automaticamente ao carregar
        window.onload = function() {
            verificarDados();
        }
    </script>
</body>
</html>
